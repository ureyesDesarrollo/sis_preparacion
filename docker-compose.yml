services:

  web:
    build: .
    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html/sis_preparacion

    depends_on:
      - db

  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_sis_preparacion

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: